<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Club Concierge</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #1f2937; }
    h1 { color: #14532d; }
    #log { display: flex; flex-direction: column; gap: .75rem; margin: 1rem 0; }
    .msg { padding: .75rem 1rem; border-radius: .75rem; line-height: 1.4; }
    .user { background: #dcfce7; align-self: flex-end; }
    .bot { background: #f3f4f6; }
    .sources { font-size: .8rem; color: #6b7280; margin-top: .4rem; }
    form { display: flex; gap: .5rem; }
    input { flex: 1; padding: .6rem; border: 1px solid #d1d5db; border-radius: .5rem; font-size: 1rem; }
    button { padding: .6rem 1rem; background: #15803d; color: white; border: 0; border-radius: .5rem; font-size: 1rem; }
  </style>
</head>
<body>
  <h1>Maple Ridge Club Concierge</h1>
  <p>Ask about dining, tee times, guests, the pool and more. Answers come only from the club's documents.</p>
  <div id="log"></div>
  <form id="form">
    <label for="q" hidden>Your question</label>
    <input id="q" placeholder="Can I bring two guests on Saturday?" autocomplete="off" required>
    <button>Ask</button>
  </form>
  <script>
    const log = document.getElementById("log");
    const input = document.getElementById("q");

    function add(text, cls, sources) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text;
      if (sources && sources.length) {
        const s = document.createElement("div");
        s.className = "sources";
        s.textContent = "Sources: " + sources.join("; ");
        div.appendChild(s);
      }
      log.appendChild(div);
    }

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const question = input.value.trim();
      add(question, "user");
      input.value = "";
      try {
        const res = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });
        const data = await res.json();
        add(data.answer, "bot", data.sources);
      } catch {
        add("Sorry, something went wrong. Please try again.", "bot");
      }
    });
  </script>
</body>
</html>
